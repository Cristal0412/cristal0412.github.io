    Projects:
      - name: Spatial Transcriptomics Clustering
        summary: Assessed clustering and spatial-domain detection methods across simulated and real spatial transcriptomics datasets.
        highlights:
          - Applied quality control, normalization, feature selection, PCA, K-means, Seurat, BayesSpace, and STitch3D.

      - name: Quantitative Benchmarking in Single-Cell Analysis
        summary: Developed a structured framework to evaluate methodological benchmarking studies in single-cell research.
        highlights:
          - Screened 563 studies and evaluated 245 relevant papers using a questionnaire with more than 70 criteria.
          - Used linear and logistic regression to identify factors associated with benchmarking study design.

      - name: Ciliary Hedgehog Signaling in Meibomian Gland Development
        summary: Investigated the stage-specific roles of primary cilia and Hedgehog signaling in gland morphogenesis and adult tissue homeostasis.

