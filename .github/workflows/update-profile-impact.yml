name: Update homepage Scholar impact

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Refresh Google Scholar data
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python bin/update_profile_impact.py
      - name: Commit and deploy updated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/scholar_impact.json assets/data/scholar_impact.json; then
            echo "Scholar data is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar_impact.json assets/data/scholar_impact.json
          git commit -m "Update homepage Scholar impact"
          git push
          gh workflow run deploy.yml --ref main
